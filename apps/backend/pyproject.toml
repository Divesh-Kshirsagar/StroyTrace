[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.38.0,<1.39",
    "celery>=5.4.0,<5.5",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.2",
    "django-ratelimit>=4.1.0",
    "email-validator>=2.3.0",
    "pyjwt>=2.13.0",
    "python-magic==0.4.27",
    "pyvips>=2.2.0,<2.3",
    "pytest>=9.1.1",
    "pytest-playwright>=0.8.0",
    "redis>=5.2.0,<5.3",
    "ruff>=0.16.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "djangorestframework-stubs>=3.17.1",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*", "factories.*"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.base"

[tool.ruff.lint]
ignore = ["RUF012", "BLE001", "DTZ006"]
