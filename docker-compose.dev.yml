version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: clarity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z

  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./apps/backend:/app:Z
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - POSTGRES_DB=clarity_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    command: pnpm dev
    volumes:
      - ./apps/frontend:/app:Z
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  postgres_data:
